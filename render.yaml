services:
  - type: web
    name: kesandu
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: EXPO_PUBLIC_GEMINI_API_KEY
        scope: build
        sync: false
      - key: EXPO_PUBLIC_API_URL
        scope: build
        sync: false
